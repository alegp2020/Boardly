<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="logo-icono.svg" type="image/x-icon">
    <link rel="stylesheet" href="login.css" />
    <title>Iniciar sesión</title>
  </head>
  <body>
    <main>
      <form class="formualario-login" action="" method="post">
        <h1 class="titulo-inicial text-center">Bienvenido</h1>
        <p class="justify-content-center align-items-center text-center">
          Inicia sesión
        </p>
        <div class="alert alert-danger d-none" role="alert"></div>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="nombre" class="form-control" id="nombre" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" />
        </div>
        <button class="boton-entrar-login w-100" type="submit">Entrar</button>
      </form>
      <p class="crear-nuevo-usuario mt-4">
        No tienes una cuenta creada?<a href="registrarse.html">Registrate</a>
      </p>
    </main>

    <script src="login.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
