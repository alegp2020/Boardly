<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="logo-icono.svg" type="image/x-icon">
    <link rel="stylesheet" href="styles.css" />
    <title>Boardly</title>
  </head>

  <body>
    <nav>
      <ul>
        <li>
          <a href="#"
            ><img src="logo-icono(1).svg" alt="Logo" width="50" height="50"
          /></a>
          <li>
            <button class="cerrar-sesion">Cerrar sesión</button>
          </li>
        </li>
        <li>
          <button
            class="añadir-carta btn"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#exampleModal"
          >
            Añadir carta
          </button>
        </li>
      </ul>
    </nav>

    <h1 class="titulo">Boardly</h1>
    <p class="nombre"></p>
    <section class="entero">
      <div class="columna ideas">
        <h2>Ideas <span class="numeroTarjetas">0</span></h2> 
        <div class="tarjetasAñadidas"></div>
      </div>
      <div class="columna pendientes">
        <h2>Pendiente <span class="numeroTarjetas">0</span></h2>
        <div class="tarjetasAñadidas"></div>
      </div>
      <div class="columna procesos">
        <h2>Proceso <span class="numeroTarjetas">0</span></h2>

        <div class="tarjetasAñadidas"></div>
      </div>
      <div class="columna hechos">
        <h2>Hecho <span class="numeroTarjetas">0</span></h2>
        <div class="tarjetasAñadidas"></div>
      </div>
    </section>

    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Crealo aqui</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form class="formulario">
              <label for="titulo-nueva">Titulo</label>
              <input type="text" class="titulo-nueva" />
              <label for="descripcion">Descripcion</label>
              <input type="text" class="descripcion" />
              <label for="objetivos">Objetivos</label>
              <input type="text" class="objetivos" />
              <label for="prioridad">Prioridad</label>
              <select name="tipo-prioridad" id="prioridades">
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja">Baja</option>
              </select>
              <button type="button" class="añadir-definitiva">Añadir</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
